<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product details | Suji Professional</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body class="product-detail-page">
  <header class="site-header fixed-top">
    <nav class="navbar navbar-expand-lg container">
      <a class="brand" href="index.html">
        <img src="img/logo1.png" alt="">
        <span class="brand-text">Suji</span>
      </a>
      <a class="cart-button" href="index.html" aria-label="Cart, 0 items">
        Cart <span class="cart-count">0</span>
      </a>
    </nav>
  </header>

  <main class="product-detail-main">
    <div class="container">
      <a class="product-back-link" href="index.html">
        <i class="bi bi-arrow-left" aria-hidden="true"></i> Back to products
      </a>

      <section class="product-detail-layout" id="productDetails" aria-labelledby="detailName">
        <div class="product-detail-image-wrap">
          <img class="product-detail-image" id="detailImage" src="" alt="">
        </div>
        <div class="product-detail-info">
          <p class="product-detail-category" id="detailCategory"></p>
          <h1 id="detailName"></h1>
          <div class="product-detail-rating" aria-label="Rated 5 out of 5">
            <span aria-hidden="true">★★★★★</span>
            <span class="product-detail-rating-label">Customer favourite</span>
          </div>
          <p class="product-detail-price" id="detailPrice"></p>
          <p class="product-detail-description" id="detailDescription"></p>
          <ul class="product-detail-benefits" id="detailBenefits"></ul>

          <div class="product-detail-actions">
            <div class="quantity-control" aria-label="Quantity">
              <button type="button" id="quantityMinus" aria-label="Decrease quantity">−</button>
              <output id="quantity" aria-live="polite">1</output>
              <button type="button" id="quantityPlus" aria-label="Increase quantity">+</button>
            </div>
            <button type="button" class="product-detail-add" id="addToCart">Add to cart</button>
          </div>
          <p class="product-detail-note"><i class="bi bi-truck" aria-hidden="true"></i> Thoughtful skincare, delivered to your door.</p>
        </div>
      </section>

      <div class="product-detail-error" id="productError" role="alert" hidden>
        <h1>Product not found</h1>
        <p>Sorry, this product is unavailable. Please return to the products page.</p>
        <a class="product-detail-add" href="index.html">Browse products</a>
      </div>
    </div>
  </main>

  <script>
    const products = {
      1: {
        name: 'Hydrating Velvet Body Elixir',
        category: 'Body lotion',
        image: 'img/products/product1.jpg',
        price: '$24.10',
        description: 'A silky-soft body lotion that deeply nourishes and soothes the skin, leaving it feeling comfortable and smooth.',
        benefits: ['Deeply nourishes and hydrates', 'Silky, lightweight feel', 'Made for everyday use']
      },
      2: {
        name: 'Balance Repair Moisture Cream',
        category: 'Face cream',
        image: 'img/products/product2.jpg',
        price: '$20.18',
        description: 'A gentle yet effective face cream that helps restore balance and lasting hydration.',
        benefits: ['Helps replenish moisture', 'Comfortable daily care', 'Gentle, nourishing formula']
      },
      3: {
        name: 'Light Veil Radiance Serum',
        category: 'Facial serum',
        image: 'img/products/product3.jpg',
        price: '$22.40',
        description: 'A lightweight serum that brightens and hydrates without leaving a heavy residue.',
        benefits: ['Lightweight texture', 'Helps boost radiance', 'Hydrates without residue']
      },
      4: {
        name: 'Daily Glow Face Serum',
        category: 'Facial serum',
        image: 'img/products/product4.jpg',
        price: '$22.40',
        description: 'A daily serum with a smooth, lightweight feel to leave skin looking fresh and radiant.',
        benefits: ['Easy to layer into your routine', 'Lightweight, smooth finish', 'Suitable for everyday care']
      },
      5: {
        name: 'Botanical Hydration Cream',
        category: 'Face cream',
        image: 'img/products/product5.jpg',
        price: '$22.40',
        description: 'A comforting daily moisturiser designed to leave skin feeling soft, calm, and hydrated.',
        benefits: ['Comforting daily moisture', 'Soft, non-heavy feel', 'Simple addition to your routine']
      },
      6: {
        name: 'Nourishing Skin Essence',
        category: 'Skin essence',
        image: 'img/products/product6.jpg',
        price: '$22.40',
        description: 'A nourishing essence that layers easily into your routine for a fresh, hydrated feel.',
        benefits: ['Layers easily with skincare', 'Helps skin feel hydrated', 'Light, comfortable texture']
      },
      7: {
        name: 'Velvet Finish Skin Balm',
        category: 'Skin balm',
        image: 'img/products/product7.jpg',
        price: '$22.40',
        description: 'A soft, nourishing balm for a smooth and comfortable finish in your everyday routine.',
        benefits: ['Nourishing feel', 'Smooth, velvety finish', 'Easy everyday care']
      }
    };

    const product = products[new URLSearchParams(window.location.search).get('id')];
    const details = document.getElementById('productDetails');
    const error = document.getElementById('productError');
    const cartCount = document.querySelector('.cart-count');
    const cartButton = document.querySelector('.cart-button');
    const savedCount = Number(localStorage.getItem('sujiCartCount'));
    let itemsInCart = Number.isSafeInteger(savedCount) && savedCount >= 0 ? savedCount : 0;

    function updateCart() {
      cartCount.textContent = itemsInCart;
      cartButton.setAttribute('aria-label', `Cart, ${itemsInCart} items`);
    }

    updateCart();

    if (!product) {
      details.hidden = true;
      error.hidden = false;
      document.title = 'Product not found | Suji Professional';
    } else {
      document.title = `${product.name} | Suji Professional`;
      document.getElementById('detailImage').src = product.image;
      document.getElementById('detailImage').alt = product.name;
      document.getElementById('detailCategory').textContent = product.category;
      document.getElementById('detailName').textContent = product.name;
      document.getElementById('detailPrice').textContent = product.price;
      document.getElementById('detailDescription').textContent = product.description;
      document.getElementById('detailBenefits').innerHTML = product.benefits
        .map(benefit => `<li><i class="bi bi-check2" aria-hidden="true"></i>${benefit}</li>`)
        .join('');
    }

    let quantity = 1;
    const quantityOutput = document.getElementById('quantity');
    document.getElementById('quantityMinus').addEventListener('click', () => {
      quantity = Math.max(1, quantity - 1);
      quantityOutput.value = quantity;
      quantityOutput.textContent = quantity;
    });
    document.getElementById('quantityPlus').addEventListener('click', () => {
      quantity += 1;
      quantityOutput.value = quantity;
      quantityOutput.textContent = quantity;
    });
    document.getElementById('addToCart').addEventListener('click', () => {
      if (!product) return;
      itemsInCart += quantity;
      localStorage.setItem('sujiCartCount', itemsInCart);
      updateCart();
      const button = document.getElementById('addToCart');
      button.textContent = 'Added to cart';
      window.setTimeout(() => { button.textContent = 'Add to cart'; }, 1200);
    });
  </script>
</body>
</html>
